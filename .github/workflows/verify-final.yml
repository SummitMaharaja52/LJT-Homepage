name: Verify final site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check rendered content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "First-year PhD candidate at HKUST NLP Group" _site/index.html
          grep -q "Natural Language Processing" _site/index.html
          grep -q "Machine Learning" _site/index.html
          grep -q "LLM Reasoning and Reinforcement Learning" _site/index.html
          grep -q "Hallucination in Vision-Language Models" _site/index.html
          grep -q "LLM Truthfulness and Interpretability" _site/index.html
          grep -q "Hong Kong University of Science and Technology" _site/index.html
          grep -q "Shanghai Jiao Tong University" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Zifei Shan" _site/index.html
          grep -q "Prof. Yu Cheng" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -q "In-Context Sharpness as Alerts" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/publications/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html
          grep -q "In-Context Sharpness as Alerts" _site/publications/index.html
          grep -q "C-Eval" _site/publications/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html
          echo "All final checks passed."
